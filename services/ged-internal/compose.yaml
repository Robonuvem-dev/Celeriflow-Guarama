name: celeriflow-ged
services:
  ocr:
    build:
      context: ../..
      dockerfile: services/ged-ocr/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      GED_OCR_API_KEY: ${GED_OCR_API_KEY:?Gere a configuração primeiro}
    volumes:
      - ocr-cache:/service/ocr-cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 180s
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 70s

  documents:
    build:
      context: ../..
      dockerfile: services/ged-documents/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      GED_CONVERSION_API_KEY: ${GED_CONVERSION_API_KEY:?Gere a configuração primeiro}
      GED_PDFA_API_KEY: ${GED_PDFA_API_KEY:?Gere a configuração primeiro}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3312/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 95s

  semantic:
    build:
      context: ../ged-semantic
    restart: unless-stopped
    init: true
    environment:
      GED_SEMANTIC_API_KEY: ${GED_SEMANTIC_API_KEY:?Gere a configuração primeiro}
      GED_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      GED_EMBEDDING_REVISION: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      GED_SEMANTIC_THREADS: 2
    volumes:
      - semantic-cache:/home/semantic/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3311/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 70s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GED_SERVICES_DOMAIN: ${GED_SERVICES_DOMAIN:?Informe o domínio dos serviços}
      GED_TLS_EMAIL: ${GED_TLS_EMAIL:?Informe o e-mail do certificado}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      ocr:
        condition: service_healthy
      documents:
        condition: service_healthy
      semantic:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: services/ged-internal/Worker.Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.worker
        required: false
    environment:
      GED_OCR_ENDPOINT: https://${GED_SERVICES_DOMAIN}/ocr
      GED_SEMANTIC_ENDPOINT: https://${GED_SERVICES_DOMAIN}/embed
      GED_CONVERSION_ENDPOINT: https://${GED_SERVICES_DOMAIN}/convert
      GED_PDFA_ENDPOINT: https://${GED_SERVICES_DOMAIN}/pdfa
      GED_OCR_API_KEY: ${GED_OCR_API_KEY}
      GED_SEMANTIC_API_KEY: ${GED_SEMANTIC_API_KEY}
      GED_CONVERSION_API_KEY: ${GED_CONVERSION_API_KEY}
      GED_PDFA_API_KEY: ${GED_PDFA_API_KEY}
    depends_on:
      gateway:
        condition: service_started
    stop_grace_period: 600s
    mem_limit: 2g

volumes:
  ocr-cache:
  semantic-cache:
  tls-data:
  tls-config:
